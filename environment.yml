name: md-contactml
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.12
  - mdanalysis>=2.5
  - networkx>=3.0
  - tqdm>=4.65
  - openmm>=8.1
  - pdbfixer
  # OpenMM can use a system CUDA installation when available. This optional
  # runtime constraint applies only on Linux and is not needed for CPU runs.
  - cuda-version>=12.0  # [linux]
